[project]
name = "py-clean-event-driven-architecture"
version = "0.1.0"
description = "Clean Event-Driven Architecture with Python"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "paho-mqtt",
    "psycopg2-binary",
    "yoyo-migrations",
    "starlette",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "application",
    "domain",
    "infrastructure",
    "presentation",
]
