<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="rgba(0,0,0,0.28)"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="rgba(0,0,0,0.18)"/>
    </filter>

    <radialGradient id="blueGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6AAEE0"/>
      <stop offset="100%" stop-color="#3A78BE"/>
    </radialGradient>

    <radialGradient id="greenGrad" cx="50%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#6FCC5A"/>
      <stop offset="100%" stop-color="#4A9E35"/>
    </radialGradient>

    <radialGradient id="purpleGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#8B65BA"/>
      <stop offset="100%" stop-color="#5E3A9A"/>
    </radialGradient>

    <radialGradient id="domainGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7050B8"/>
      <stop offset="100%" stop-color="#4A2E90"/>
    </radialGradient>

    <linearGradient id="bootstrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8B651"/>
      <stop offset="100%" stop-color="#E97D20"/>
    </linearGradient>

    <linearGradient id="configGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ED7CC"/>
      <stop offset="100%" stop-color="#34998D"/>
    </linearGradient>

    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D7D7D7"/>
    </marker>
  </defs>

  <!-- Bootstrap boundary: composition root wraps the whole application wiring -->
  <circle cx="250" cy="270" r="246"
          fill="none" stroke="#F39A2B" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="18 12"/>

  <rect x="371" y="28" width="158" height="48" rx="15"
        fill="url(#bootstrapGrad)" filter="url(#softShadow)"/>
  <text x="450" y="52"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="21" font-weight="700"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        letter-spacing="0.4">Bootstrap</text>

  <!-- Main clean architecture diagram -->
  <circle cx="250" cy="270" r="220" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <path d="M 30,270 A 220,220 0 0 1 470,270 Z" fill="url(#blueGrad)"/>
  <circle cx="250" cy="270" r="220" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>

  <circle cx="250" cy="270" r="148" fill="url(#purpleGrad)"/>

  <circle cx="250" cy="270" r="72" fill="url(#domainGrad)"/>
  <circle cx="250" cy="270" r="72" fill="none" stroke="rgba(255,255,255,0.80)" stroke-width="2.5"/>

  <!-- Config feeds the bootstrap boundary, not an inner clean architecture layer -->
  <rect x="515" y="246" width="100" height="48" rx="14"
        fill="url(#configGrad)" filter="url(#softShadow)"/>
  <line x1="515" y1="270" x2="503" y2="270"
        stroke="#D7D7D7" stroke-width="4"
        stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <text x="565" y="270"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="18" font-weight="700"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        letter-spacing="0.4">Config</text>

  <!-- Labels -->
  <text x="250" y="88"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="25" font-weight="700"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        letter-spacing="0.5">Presentation</text>

  <text x="250" y="158"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="23" font-weight="700"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        letter-spacing="0.5">Application</text>

  <text x="250" y="270"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="22" font-weight="700"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        letter-spacing="0.5">Domain</text>

  <text x="250" y="455"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" font-size="25" font-weight="700"
        font-family="'Segoe UI', Arial, Helvetica, sans-serif"
        letter-spacing="0.5">Infrastructure</text>

  <!-- Dependency direction arrows -->
  <polygon
    points="242,104 258,104
            258,135 266,135
            250,149
            234,135 242,135"
    fill="#ABABAB"/>

  <polygon
    points="242,174 258,174
            258,199 266,199
            250,213
            234,199 242,199"
    fill="#ABABAB"/>

  <polygon
    points="242,444 258,444
            258,421 266,421
            250,407
            234,421 242,421"
    fill="#ABABAB"/>
</svg>
